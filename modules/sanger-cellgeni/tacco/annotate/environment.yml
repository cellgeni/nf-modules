---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# tacco 0.5.0 is only on PyPI (conda-forge stops at 0.4.0.post1). Pins match quay.io/cellgeni/tacco:0.5.0.
channels:
  - conda-forge
  - bioconda
dependencies:
  - "conda-forge::pip=25.0.1"
  - "conda-forge::procps-ng=4.0.6"
  - "conda-forge::python=3.12.16"
  - pip:
      - "tacco==0.5.0"
      - "anndata==0.13.4"
      - "pandas==2.3.3"
      - "scanpy==1.12.6"
