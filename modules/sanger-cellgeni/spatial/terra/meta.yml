name: "spatial_terra"
description: write your description here
keywords:
  - spatial
  - single-cell
  - terra
  - cell-cell interaction
tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "spatial":
      description: ""
      homepage: ""
      documentation: ""
      tool_dev_url: ""
      doi: ""
      licence: null
      identifier: null

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - anndata:
        type: file
        description: AnnData input file
        pattern: "*.h5ad"
        ontologies:
          - edam: "http://edamontology.org/format_3590" # HDF5

output:
  processed_anndata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.h5ad":
          type: file
          description: Processed AnnData output file
          pattern: "*.h5ad"
          ontologies:
            - edam: "http://edamontology.org/format_3590" # HDF5
  tokenized_data:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "tokenized_data/*":
          type: file
          description: Tokenized data output files
          pattern: "tokenized_data/*"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML

authors:
  - "@BioinfoTongLI"
maintainers:
  - "@BioinfoTongLI"
