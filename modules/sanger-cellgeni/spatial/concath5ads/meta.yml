# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "spatial_concath5ads"
description: write your description here
keywords:
  - sort
  - example
  - genomics
tools:
  - "scanpy":
      description: "Single-cell analysis toolkit used here to concatenate AnnData H5AD files."
      homepage: "https://scanpy.readthedocs.io/"
      documentation: "https://scanpy.readthedocs.io/"
      tool_dev_url: "https://github.com/scverse/scanpy"
      doi: "10.1186/s13059-017-1382-0"
      licence: ["BSD-3-Clause"]
      identifier: biotools:scanpy

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          `meta.id` is used as the default output prefix.
          e.g. `[ id:'sample1' ]`
    - anndatas:
        type: file
        description: One or more AnnData H5AD files to concatenate, in order
        pattern: "*.{h5ad}"
        ontologies:
          - edam: "http://edamontology.org/format_3590" # H5AD

output:
  ### TODO nf-core: Add a description of all of the variables used as output
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.bam":
          type: file
          description: Sorted BAM/CRAM/SAM file
          pattern: "*.{bam,cram,sam}"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
            - edam: "http://edamontology.org/format_2573" # CRAM
            - edam: "http://edamontology.org/format_3462" # SAM
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML

authors:
  - "@BioinfoTongLI"
maintainers:
  - "@BioinfoTongLI"
