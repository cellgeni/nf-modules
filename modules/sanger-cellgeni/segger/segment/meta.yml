name: "segger_segment"
description: Train a segger model and segment a spatial transcriptomics dataset end-to-end
keywords:
  - segmentation
  - spatial transcriptomics
  - xenium
  - merscope
  - cosmx
  - graph neural network
tools:
  - "segger":
      description: "segger is a graph neural network-based cell segmentation tool for spatial transcriptomics data."
      homepage: "https://github.com/dpeerlab/segger"
      documentation: "https://github.com/dpeerlab/segger"
      tool_dev_url: "https://github.com/dpeerlab/segger"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input_dir:
        type: directory
        description: |
          Input directory with the spatial transcriptomics dataset, passed as `-i`.
          The platform is detected from its contents: 10x Xenium (`transcripts.parquet`
          and boundary parquets), Vizgen MERSCOPE, NanoString CosMx, or segger's
          standard format (set `--platform standard` in ext.args). Custom transcripts and
          boundaries files can be given with `--transcripts`, `--boundaries` and
          `--platform` in ext.args.

output:
  segmentation:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${out_dir}/segger_segmentation.parquet":
          type: file
          description: |
            One row per transcript, with columns row_index, segger_cell_id,
            segger_similarity and similarity_threshold. Use SEGGER_EXPORT to turn it
            into AnnData, cell boundaries, SpatialData or Xenium Ranger inputs.
            By default `segger segment` also writes `<out_dir>/export/adata.h5ad`, which
            this module does not emit; pass `--empty-export` in ext.args to skip it.
          pattern: "*_segger/segger_segmentation.parquet"
          ontologies: []
  versions_segger:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "segger":
          type: string
          description: The name of the tool
      - "python -c \"from importlib.metadata import version; print(version('segger'))\"":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "segger":
          type: string
          description: The name of the tool
      - "python -c \"from importlib.metadata import version; print(version('segger'))\"":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@BioinfoTongLI"
maintainers:
  - "@BioinfoTongLI"
