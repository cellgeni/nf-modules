---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "stalign"
description: Align an ordered series of spatial sections (cell tables, Xenium output folders or SpatialData objects) to one reference section with STalign (LDDMM, C++ engine) and write all of them into a single SpatialData object, in which the sections stay unwarped and are registered to the reference through SpatialData affine transformations.
keywords:
  - spatial
  - spatial transcriptomics
  - xenium
  - alignment
  - registration
  - lddmm
  - spatialdata
tools:
  - "stalign":
      description: "Alignment of spatial transcriptomics data with diffeomorphic metric mapping (LDDMM)"
      homepage: "https://jef.works/STalign/"
      documentation: "https://jef.works/STalign/notebooks/xenium-xenium-alignment.html"
      tool_dev_url: "https://github.com/JEFworks-Lab/STalign"
      doi: "10.1038/s41467-023-43915-7"
      licence:
        - "GPL-3.0"
      identifier: ""
  - "spatialdata":
      description: "An open and universal framework for processing spatial omics data"
      homepage: "https://spatialdata.scverse.org"
      documentation: "https://spatialdata.scverse.org/en/latest/api/transformations.html"
      tool_dev_url: "https://github.com/scverse/spatialdata"
      doi: "10.1038/s41592-024-02212-x"
      licence:
        - "BSD-3-Clause"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'breast_series' ]`
    - source_cells:
        type: list
        description: |
          Ordered list of the sections to align (one is also accepted), each any of: a cell table
          (CSV, TSV, optionally gzipped, or parquet, e.g. Xenium cells.csv.gz) with x/y centroids in
          micrometers (default columns x_centroid, y_centroid; `--x-col`/`--y-col` in ext.args); a
          Xenium output folder (its cells.parquet or cells.csv.gz); or a SpatialData .zarr (e.g. from
          spatialdata_io.xenium), whose cells are the centroids of a shapes element (`--sdata-shapes`,
          `--sdata-cs`) and whose elements are copied into the output, registered to the reference
          (`--sdata-elements`). Inputs can be mixed. Each is aligned to reference_cells independently.
          Sections are named after their files (without extensions and a trailing `cells`),
          section_01.. when these clash (e.g. all cells.csv.gz), or `--names` in ext.args.
        pattern: "*"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
          - edam: "http://edamontology.org/format_3475" # TSV
          - edam: "http://edamontology.org/format_3915" # Zarr
    - reference_cells:
        type: file
        description: |
          The reference (fixed) section, in any format of source_cells. The elements of a SpatialData
          reference are copied into the output as reference_<element>.
        pattern: "*"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
          - edam: "http://edamontology.org/format_3475" # TSV
          - edam: "http://edamontology.org/format_3915" # Zarr
    - landmarks:
        type: file
        description: |
          Optional CSV of corresponding points with columns source_x, source_y, target_x, target_y
          and, with several sections, section (a section name or its 1-based position in
          source_cells). A section's landmarks initialize its affine (STalign.L_T_from_points) and add a
          landmark term to LDDMM; sections without landmarks are aligned from the cells alone.
          Pass `[]` to align without landmarks.
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV

output:
  spatialdata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'breast_series' ]`
      - "*.zarr":
          type: directory
          description: |
            One SpatialData object of all sections and the reference. Per section: shapes
            `<section>_cells` (coordinate system `<section>`, and `aligned` through the registered
            Affine) and `<section>_cells_aligned` (exact LDDMM positions), images `<section>_density`
            and `<section>_displacement` (residual dx/dy of the LDDMM map after the Affine). Reference:
            `reference_cells` and `reference_density` in `aligned`. One `table` of all cells with
            obs `section`/`section_index` and obsm `spatial`, `spatial_aligned`, `spatial_affine`.
            The elements of SpatialData inputs (images, labels, points, shapes, tables), unwarped, as
            `<section>_<element>` and `reference_<element>`, registered to `aligned` too.
          pattern: "*.zarr"
          ontologies:
            - edam: "http://edamontology.org/format_3915" # Zarr
  cells:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'breast_series' ]`
      - "*_aligned_cells.csv.gz":
          type: file
          description: Cell tables of all sections and the reference with section, section_index (1..N in input order, 0 for the reference), aligned_x/aligned_y (LDDMM), affine_x/affine_y (registered Affine) and stalign_match_weight columns.
          pattern: "*_aligned_cells.csv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  transform:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'breast_series' ]`
      - "*_transform.npz":
          type: file
          description: One per section, <prefix>_<section>_transform.npz. STalign transform (A, v, xv0, xv1; row/column order) for STalign.transform_points_source_to_target, the registered affine (affine_xy) and the matching weights.
          pattern: "*_transform.npz"
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'breast_series' ]`
      - "*_stalign.json":
          type: file
          description: Parameters, LDDMM engine, and per-section run time, affine matrices, residuals and landmark errors.
          pattern: "*_stalign.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
  qc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'breast_series' ]`
      - "*_qc.png":
          type: file
          description: One per section, <prefix>_<section>_qc.png. Overlay of the section and reference cells before alignment, after the affine and after LDDMM, and the matching weights. Not written with `--no-qc`.
          pattern: "*_qc.png"
          ontologies:
            - edam: "http://edamontology.org/format_3603" # PNG
  versions_stalign:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "stalign":
          type: string
          description: The name of the tool
      - "python -c 'import STalign; print(STalign.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_spatialdata:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spatialdata":
          type: string
          description: The name of the tool
      - "python -c 'import importlib.metadata as m; print(m.version(\"spatialdata\"))'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "stalign":
          type: string
          description: The name of the tool
      - "python -c 'import STalign; print(STalign.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spatialdata":
          type: string
          description: The name of the tool
      - "python -c 'import importlib.metadata as m; print(m.version(\"spatialdata\"))'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@BioinfoTongLI"
maintainers:
  - "@BioinfoTongLI"
