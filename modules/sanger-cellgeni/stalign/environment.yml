---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Conda is not supported by this module (see main.nf): STalign 2.0.0 is not on PyPI or conda and is
# installed in the container from git (JEFworks-Lab/STalign@8a84bf1facc5173f7155400867a09c302125904e)
# together with its compiled C++ LDDMM engine. The pins below are the container's other dependencies.
channels:
  - conda-forge
  - bioconda
dependencies:
  - "conda-forge::pip=24.2"
  - "conda-forge::procps-ng=4.0.6"
  - "conda-forge::python=3.12.15"
  - pip:
      - "torch==2.15.0"
      - "spatialdata==0.8.0"
      - "anndata==0.13.4"
      - "matplotlib==3.11.2"
