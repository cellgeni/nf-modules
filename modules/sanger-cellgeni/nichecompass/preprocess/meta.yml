name: "nichecompass_preprocess"
description: |
  Preprocess spatial H5AD batches for NicheCompass model training.
  Computes spatial neighbour graphs, concatenates batches with block-diagonal
  adjacency, sanitizes data, and embeds prior gene program masks from
  OmniPath, NicheNet v2, and MEBOCOST into the AnnData object.
keywords:
  - spatial_atlas_building
  - niche_identification
  - cell-cell_communication_inference
  - preprocessing
  - deep-learning
tools:
  - "nichecompass":
      description: "NicheCompass is a package for end-to-end analysis of spatial multiomics data by the Lotfollahi Lab"
      documentation: "https://nichecompass.readthedocs.io/en/latest/"
      tool_dev_url: "https://github.com/Lotfollahi-lab/nichecompass"
      doi: "https://doi.org/10.1038/s41588-025-02120-6"
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: |
          One or more H5AD files containing spatial AnnData objects.
          e.g. `[ sample1.h5ad, sample2.h5ad ]`
        pattern: "*.h5ad"

args:
  description: |
    The following arguments are **mandatory** and must be supplied via
    `task.ext.args` in your modules.config:

    - `--cell_type_key <str>` : obs column containing cell-type labels.
    - `--sample_key <str>`    : obs column identifying the sample/batch.
    - `--counts_key <str>`    : layers key for raw counts (no fallback to X).
    - `--spatial_key <str>`   : obsm key for 2-D spatial coordinates.

    These values are stored in `adata.uns['nichecompass_preprocess_params']`
    and are automatically consumed by the downstream `nichecompass/train` module.
output:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - preprocessed_h5ad:
        type: file
        description: |
          Preprocessed AnnData with spatial graphs and prior GP masks embedded,
          ready for NicheCompass model training.
        pattern: "*_preprocessed.h5ad"
    - data:
        type: directory
        description: |
          NicheCompass reference data directory (gene programs and annotations)
          copied from the container image. Required by the downstream analysis step.

  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ASUQ"
maintainers:
  - "@ASUQ"
